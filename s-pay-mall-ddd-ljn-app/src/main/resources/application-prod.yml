server:
  port: 8080

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 容器内 127.0.0.1 是容器自己。当前本机 MySQL 是 dev-mysql，映射在宿主机 3306。
spring:
  datasource:
    username: root
    password: 1234
    url: jdbc:mysql://host.docker.internal:3306/s-pay-mall?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15
    idle-timeout: 180000
    maximum-pool-size: 25
    auto-commit: true
    max-lifetime: 1800000
    connection-timeout: 30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

weixin:
  config:
    originalid: gh_f81ffc22a71a
    token: b8b6
    app-id: wxeb9d832b7cde6b57
    app-secret: ${WEIXIN_APP_SECRET}
    template_id: ULlfzE7yTwAJz1HQCLtSPX62uf9ARK3JmUV2Y7UV5As

alipay:
  enabled: true
  app_id: 9021000166625040
  merchant_private_key: ${ALIPAY_MERCHANT_PRIVATE_KEY}
  alipay_public_key: ${ALIPAY_PUBLIC_KEY}
  notify_url: http://dabuw.nat100.top/api/v1/alipay/alipay_notify_url
  return_url: https://dabuw.online
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  pay_mode: wap

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml